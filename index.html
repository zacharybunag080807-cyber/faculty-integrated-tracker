<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FSF (Faculty Substitute Finder)</title>
<link href="https://fonts.googleapis.com/css2?family=Della+Respira&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
:root{
  --forest:#003d26; --primary:#005A36; --primary-hover:#004227; --accent:#FFC72C; --accent-hover:#e0ac20;
  --paper:#edf0e8; --card:#fbfcf8; --field:#e6ebe0; --ink:#14201a; --muted:#5d6b62; --line:#d5dccf;
  --danger:#c62828; --success:#16794a;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:var(--paper);color:var(--ink);padding:16px 16px 48px}
.container{max-width:920px;margin:0 auto}

/* Masthead: timetable with integrated status badge */
header{position:relative;overflow:hidden;background:var(--forest);color:#fff;border-radius:28px;padding:34px 32px 64px;margin-bottom:-28px}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:22px;
  background:repeating-linear-gradient(90deg,var(--accent) 0 38px,transparent 38px 46px,rgba(255,199,44,.45) 46px 70px,transparent 70px 78px,rgba(255,199,44,.18) 78px 96px,transparent 96px 104px)}
.header-top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap}
header h1{margin:0;font-family:'Della Respira',serif;font-weight:400;font-size:clamp(1.9rem,5vw,3rem);line-height:1.05;color:var(--accent);max-width:12em}
header p{margin:10px 0 0;color:#cfe3d7;font-size:.95rem}

.masthead-status{display:none;align-items:center;gap:10px;background:rgba(0,0,0,.25);padding:8px 16px;border-radius:999px;font-size:.82rem;color:#cfe3d7;backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.08)}
.masthead-status b{color:#fff}
.masthead-status button{background:rgba(255,255,255,.15);color:#fff;padding:4px 10px;font-size:.75rem;border-radius:999px}
.masthead-status button:hover{background:rgba(255,255,255,.3)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#2fbf71;box-shadow:0 0 0 3px rgba(47,191,113,.25)}

.panel{position:relative;background:var(--card);border-radius:28px;padding:28px;box-shadow:0 18px 40px -22px rgba(0,40,24,.45)}
h2{margin:0 0 20px;font-family:'Della Respira',serif;font-weight:400;font-size:1.7rem;color:var(--forest)}
h3{font-family:'Della Respira',serif;font-weight:400;font-size:1.3rem;color:var(--forest);margin:0 0 6px}

/* Tabs */
.nav-tabs{display:flex;gap:6px;background:var(--forest);padding:6px;border-radius:999px;margin:0 0 18px;position:relative;z-index:1}
.nav-tabs button{flex:1;background:transparent;color:#bcd3c5;border-radius:999px;padding:12px 10px;font-size:.9rem}
.nav-tabs button:hover{background:rgba(255,255,255,.08)}
.nav-tabs button.active{background:var(--accent);color:#2b2200}
.tab-content{display:none}.tab-content.active{display:block}

/* Fields */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 18px}
.grid .wide{grid-column:1/-1}
.form-group{margin-bottom:16px}.grid .form-group{margin:0}
label{display:block;font-weight:600;font-size:.82rem;color:var(--muted);margin:0 0 6px 4px}
input,select{width:100%;padding:13px 16px;border:2px solid transparent;border-radius:14px;background:var(--field);font:inherit;font-size:.95rem;color:var(--ink);transition:background .15s,border-color .15s}
input::placeholder{color:#8a978f}
input:focus,select:focus{outline:none;background:#fff;border-color:var(--primary)}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--primary);margin-right:8px;vertical-align:-3px}
.check{display:flex;align-items:center;background:var(--field);border-radius:14px;padding:12px 16px;cursor:pointer;color:var(--ink);margin:0}

button{font:inherit;font-weight:600;font-size:.92rem;background:var(--primary);color:#fff;border:0;border-radius:999px;padding:13px 26px;cursor:pointer;transition:background .15s,transform .1s}
button:hover{background:var(--primary-hover)}button:active{transform:scale(.97)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn-primary{background:var(--accent);color:#2b2200;margin-top:22px;padding:14px 30px}
.btn-primary:hover{background:var(--accent-hover)}
.btn-secondary{background:#e2e8dc;color:var(--forest)}.btn-secondary:hover{background:#d3dccb}
.btn-link{background:none;color:var(--primary);padding:0;text-decoration:underline;border-radius:0}
.btn-link:hover{background:none}
.btn-danger{background:#fbe4e1;color:var(--danger);padding:7px 14px;font-size:.8rem;flex-shrink:0}
.btn-danger:hover{background:var(--danger);color:#fff}

.alert{padding:12px 16px;border-radius:14px;margin-top:14px;font-size:.9rem}
.alert-error{background:#fde7e4;color:#9b1c1c}.alert-success{background:#dff3e6;color:#0f5f39}.alert-info{background:#fff3cc;color:#7a5500}

/* Sign in */
#authView{max-width:440px;margin:0 auto}
#authView .panel{margin-top:0}
#appView{display:none}
.auth-wrap{margin-top:-28px;position:relative;z-index:1}

/* Output + schedules */
.output-box{margin-top:22px;max-height:560px;overflow-y:auto}
.slot{background:#fff;border:1px solid var(--line);border-left:6px solid var(--accent);border-radius:18px;padding:18px;margin-bottom:14px}
.slot .when{font-size:.85rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{background:#dff3e6;color:#0f5f39;border-radius:999px;padding:6px 14px;font-size:.85rem;font-weight:600}
.chip.none{background:#fde7e4;color:#9b1c1c}
.chat{margin-top:16px;background:var(--paper);border-radius:16px;padding:12px}
.chat h4{margin:0 0 8px;font-size:.9rem;color:var(--forest)}
.chat-msgs{max-height:130px;overflow-y:auto;margin-bottom:10px;font-size:.85rem;display:flex;flex-direction:column;gap:6px}
.chat-msgs div{background:#fff;border-radius:14px;padding:7px 12px;align-self:flex-start;max-width:90%}
.chat-row{display:flex;gap:8px}.chat-row input{background:#fff;padding:10px 14px}.chat-row button{padding:10px 20px}

.schedule-list{margin-top:18px;display:grid;gap:16px}
.prof{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px}
.prof-header{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--forest);color:var(--accent);display:grid;place-items:center;font-family:'Della Respira',serif;font-size:1.15rem;flex-shrink:0;overflow:hidden;object-fit:cover;}
.avatar img{width:100%;height:100%;object-fit:cover}
.prof-name{flex:1;min-width:0}
.prof-name strong{display:block;font-size:1.02rem}
.owner-note{display:block;font-size:.78rem;color:var(--muted);margin-top:2px}
.mine-badge{background:var(--accent);color:#2b2200;font-size:.7rem;font-weight:700;padding:2px 9px;border-radius:99px;margin-left:8px;vertical-align:1px}
.schedule-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;font-size:.9rem}
.schedule-item:nth-child(even){background:#f3f6ef}
.day{width:46px;font-weight:700;color:var(--forest);flex-shrink:0}
.time{background:var(--forest);color:#fff;border-radius:999px;padding:3px 12px;font-size:.78rem;white-space:nowrap;flex-shrink:0}
.what{flex:1;min-width:0}
.what.vacant{color:var(--muted);font-style:italic}
.locked{font-size:.78rem;color:var(--muted);flex-shrink:0}
.empty{text-align:center;color:var(--muted);padding:26px 10px}

@media(max-width:600px){
  body{padding:10px 10px 40px}header{padding:26px 22px 50px;border-radius:22px}.panel{padding:20px;border-radius:22px}
  .grid{grid-template-columns:1fr}.nav-tabs{border-radius:22px;flex-direction:column}
  .schedule-item{flex-wrap:wrap}.what{flex-basis:100%;order:3}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="header-top">
      <div>
        <h1>Faculty Substitute Finder</h1>
        <p>FEU Tech web-based scheduling system</p>
      </div>
      <div id="mastheadStatus" class="masthead-status">
        <span><span class="dot"></span> Signed in as <b id="userLabel"></b></span>
        <button onclick="auth.signOut()">Sign out</button>
      </div>
    </div>
  </header>

  <!-- LOGIN / SIGN UP -->
  <div id="authView" class="auth-wrap">
    <div class="panel">
      <h2 id="authTitle">Sign in</h2>
      <div class="form-group" id="nameGroup" style="display:none;">
        <label for="authName">Your name</label>
        <input type="text" id="authName" placeholder="e.g., Mr. Demeke Bayyou">
      </div>
      <div class="form-group">
        <label for="authEmail">Email</label>
        <input type="email" id="authEmail" placeholder="name@fit.edu.ph" autocomplete="username">
      </div>
      <div class="form-group">
        <label for="authPassword">Password</label>
        <input type="password" id="authPassword" placeholder="At least 6 characters" autocomplete="current-password" onkeydown="if(event.key === 'Enter') handleAuth()">
      </div>
      <button class="btn-primary" id="authBtn" onclick="handleAuth()" style="margin-top:6px">Sign in</button>
      <p style="font-size:.9rem;color:var(--muted);margin:18px 0 0">
        <span id="authSwitchText">No account yet?</span>
        <button class="btn-link" id="authSwitchBtn" onclick="toggleAuthMode()">Create one</button>
      </p>
      <div id="authMessage"></div>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="appView" style="margin-top: 28px;">
    <div class="nav-tabs">
      <button class="active" onclick="switchTab('tab-add', this)">Add schedule</button>
      <button onclick="switchTab('tab-absence', this)">Record absence</button>
      <button onclick="switchTab('tab-view', this)">All schedules</button>
    </div>

    <!-- TAB 1 -->
    <div id="tab-add" class="tab-content active panel">
      <h2>Add a professor's schedule</h2>
      <div class="grid">
        <div class="form-group">
          <label for="profName">Professor name</label>
          <input type="text" id="profName" placeholder="e.g., Mr. Demeke Bayyou">
        </div>
        <div class="form-group">
          <label for="profAvatar">Profile picture URL (optional)</label>
          <input type="url" id="profAvatar" placeholder="https://example.com/photo.jpg">
        </div>
        <div class="form-group">
          <label for="schedDay">Day</label>
          <select id="schedDay">
            <option>Monday</option><option>Tuesday</option><option>Wednesday</option><option>Thursday</option><option>Friday</option><option>Saturday</option><option>Sunday</option>
          </select>
        </div>
        <div class="form-group">
          <label for="schedType">Type</label>
          <select id="schedType" onchange="toggleSubjectInput()">
            <option value="class">Class</option>
            <option value="vacant">Vacant</option>
          </select>
        </div>
        <div class="form-group wide" id="subjectGroup">
          <label for="schedSubject">Subject</label>
          <input type="text" id="schedSubject" placeholder="e.g., Computer Programming 1L">
        </div>
        <div class="form-group">
          <label for="startTime">Starts (7:00 AM, 13:00, 2:30 PM)</label>
          <input type="text" id="startTime" placeholder="7:00 AM">
        </div>
        <div class="form-group">
          <label for="endTime">Ends</label>
          <input type="text" id="endTime" placeholder="8:30 AM">
        </div>
      </div>
      <button class="btn-primary" onclick="handleAddSchedule()">Save schedule</button>
      <div id="addMessage"></div>
    </div>

    <!-- TAB 2 -->
    <div id="tab-absence" class="tab-content panel">
      <h2>Find a substitute</h2>
      <div class="grid">
        <div class="form-group">
          <label for="absentProfName">Absent professor</label>
          <input type="text" id="absentProfName" placeholder="e.g., Mr. Demeke Bayyou">
        </div>
        <div class="form-group">
          <label for="absenceDay">Day of absence</label>
          <select id="absenceDay">
            <option>Monday</option><option>Tuesday</option><option>Wednesday</option><option>Thursday</option><option>Friday</option><option>Saturday</option><option>Sunday</option>
          </select>
        </div>
        <div class="form-group wide">
          <label class="check"><input type="checkbox" id="specificTimeCheck" onchange="toggleAbsenceTimeInputs()">Absent only during a specific time range</label>
        </div>
      </div>
      <div id="absenceTimeSection" class="grid" style="display:none;margin-top:16px;">
        <div class="form-group">
          <label for="absenceStart">Absence starts</label>
          <input type="text" id="absenceStart" placeholder="9:00 AM">
        </div>
        <div class="form-group">
          <label for="absenceEnd">Absence ends</label>
          <input type="text" id="absenceEnd" placeholder="10:30 AM">
        </div>
        <div class="form-group wide">
          <label for="absenceSubject">Subject affected</label>
          <input type="text" id="absenceSubject" placeholder="Computer Programming 1L">
        </div>
      </div>
      <button class="btn-primary" onclick="handleRecordAbsence()">Find substitutes</button>
      <div id="absenceReport" class="output-box" style="display:none;"></div>
    </div>

    <!-- TAB 3 -->
    <div id="tab-view" class="tab-content panel">
      <h2>All schedules</h2>
      <button onclick="renderAllSchedules()" class="btn-secondary">Refresh</button>
      <div id="removeMessage"></div>
      <div id="allSchedulesContainer" class="schedule-list">
        <p class="empty">No professors added yet.</p>
      </div>
    </div>
  </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyD7_5L88hcCuLf_v9CziBl2aaFiVOR-DG0",
        authDomain: "faculty-integrated-tracker.firebaseapp.com",
        databaseURL: "https://faculty-integrated-tracker-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "faculty-integrated-tracker",
        storageBucket: "faculty-integrated-tracker.firebasestorage.app",
        messagingSenderId: "548693695605",
        appId: "1:548693695605:web:b9f6df7278524546346c3c",
        measurementId: "G-XGTD1WR0M5"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const auth = firebase.auth();
    const profRef = database.ref('professors');

    let professors = [];
    let currentUser = null;
    let chatRefs = [];

    function trim(str) { return str.trim(); }
    function toLower(str) { return str.toLowerCase(); }

    function esc(str) {
        return String(str).replace(/[&<>"']/g, c => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
    }

    function myName() {
        if (!currentUser) return '';
        return currentUser.displayName || (currentUser.email || 'User').split('@')[0];
    }

    function isMine(ownerUid) {
        return !!currentUser && ownerUid === currentUser.uid;
    }

    function initials(name) {
        let parts = trim(name).replace(/^(mr|ms|mrs|dr|prof)\.?\s+/i, '').split(' ').filter(Boolean);
        return ((parts[0] || '?')[0] + (parts.length > 1 ? parts[parts.length - 1][0] : '')).toUpperCase();
    }

    function profKey(name) {
        let clean = toLower(trim(name)).replace(/\s+/g, ' ');
        return Array.from(clean).map(ch =>
            /[a-z0-9]/.test(ch) ? ch : '_' + ch.codePointAt(0).toString(16)
        ).join('');
    }

    function showMessage(elementId, text, type) {
        let el = document.getElementById(elementId);
        el.className = `alert alert-${type}`;
        el.innerText = text;
        setTimeout(() => { el.className = ''; el.innerText = ''; }, 5000);
    }

    function friendlyError(err) {
        if (err && /permission_denied/i.test(err.message || err.code || '')) {
            return 'You can only change entries that you created.';
        }
        return (err && err.message) ? err.message : 'Something went wrong.';
    }

    // ---------- AUTH ----------
    let signUpMode = false;

    function toggleAuthMode() {
        signUpMode = !signUpMode;
        document.getElementById('authTitle').innerText = signUpMode ? 'Create account' : 'Sign in';
        document.getElementById('authBtn').innerText = signUpMode ? 'Create account' : 'Sign in';
        document.getElementById('nameGroup').style.display = signUpMode ? 'block' : 'none';
        document.getElementById('authSwitchText').innerText = signUpMode ? 'Already have an account?' : 'No account yet?';
        document.getElementById('authSwitchBtn').innerText = signUpMode ? 'Sign in' : 'Create one';
        document.getElementById('authPassword').autocomplete = signUpMode ? 'new-password' : 'current-password';
    }

    function handleAuth() {
        let email = trim(document.getElementById('authEmail').value);
        let password = document.getElementById('authPassword').value;
        let name = trim(document.getElementById('authName').value);

        if (!email || !password) {
            showMessage('authMessage', 'Enter your email and password.', 'error');
            return;
        }

        if (signUpMode) {
            if (!name) {
                showMessage('authMessage', 'Enter your name. It is shown next to the schedules you add.', 'error');
                return;
            }
            auth.createUserWithEmailAndPassword(email, password)
                .then(cred => cred.user.updateProfile({ displayName: name }))
                .then(() => {
                    currentUser = auth.currentUser;
                    document.getElementById('userLabel').innerText = myName();
                    renderAllSchedules();
                })
                .catch(err => showMessage('authMessage', err.message, 'error'));
        } else {
            auth.signInWithEmailAndPassword(email, password)
                .catch(err => showMessage('authMessage', err.message, 'error'));
        }
    }

    function handleProfessorsSnapshot(snapshot) {
        let data = snapshot.val() || {};
        professors = Object.entries(data)
            .filter(([id, p]) => p && p.name)
            .map(([id, p]) => ({
                id: id,
                name: p.name,
                avatar: p.avatar || '',
                ownerUid: p.ownerUid || null,
                ownerName: p.ownerName || 'Unknown',
                schedules: Object.entries(p.schedules || {}).map(([sid, s]) => ({ id: sid, ...s }))
            }));
        renderAllSchedules();
    }

    auth.onAuthStateChanged(user => {
        currentUser = user;
        if (user) {
            document.getElementById('authView').style.display = 'none';
            document.getElementById('appView').style.display = 'block';
            document.getElementById('mastheadStatus').style.display = 'flex';
            document.getElementById('userLabel').innerText = myName();
            profRef.on('value', handleProfessorsSnapshot, err => {
                console.error(err);
                document.getElementById('allSchedulesContainer').innerHTML =
                    '<p class="alert alert-error">Could not load schedules: ' + esc(err.message) + '</p>';
            });
        } else {
            profRef.off('value');
            clearChatListeners();
            professors = [];
            document.getElementById('appView').style.display = 'none';
            document.getElementById('mastheadStatus').style.display = 'none';
            document.getElementById('authView').style.display = 'block';
            document.getElementById('authPassword').value = '';
        }
    });

    // ---------- TIME HELPERS ----------
    function convertTime(input) {
        input = trim(input);
        let upper = input.toUpperCase();
        let period = "";

        if (upper.length >= 2) {
            let lastTwo = upper.slice(-2);
            if (lastTwo === "AM" || lastTwo === "PM") {
                period = lastTwo;
                upper = trim(upper.slice(0, -2));
            }
        }

        let colonIdx = upper.indexOf(":");
        if (colonIdx === -1) return -1;

        try {
            let hour = parseInt(upper.slice(0, colonIdx));
            let minute = parseInt(upper.slice(colonIdx + 1));

            if (isNaN(hour) || isNaN(minute) || minute < 0 || minute > 59) return -1;

            if (period === "AM" || period === "PM") {
                if (hour < 1 || hour > 12) return -1;
                if (period === "AM" && hour === 12) hour = 0;
                if (period === "PM" && hour !== 12) hour += 12;
            } else {
                if (hour < 0 || hour > 23) return -1;
            }

            return hour * 60 + minute;
        } catch {
            return -1;
        }
    }

    function displayTime(totalMinutes) {
        let hour = Math.floor(totalMinutes / 60);
        let minute = totalMinutes % 60;
        let period = hour >= 12 ? "PM" : "AM";
        let displayHour = hour % 12;
        if (displayHour === 0) displayHour = 12;
        let formattedMinute = minute < 10 ? "0" + minute : minute;
        return `${displayHour}:${formattedMinute} ${period}`;
    }

    function timeOverlaps(start1, end1, start2, end2) {
        return start1 < end2 && end1 > start2;
    }

    function findProfessorIndex(name) {
        let cleanName = toLower(trim(name)).replace(/\s+/g, ' ');
        return professors.findIndex(p => toLower(p.name).replace(/\s+/g, ' ') === cleanName);
    }

    // ---------- UI ----------
    function switchTab(tabId, btn) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.nav-tabs button').forEach(el => el.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        btn.classList.add('active');
        if (tabId === 'tab-view') renderAllSchedules();
    }

    function toggleSubjectInput() {
        let type = document.getElementById('schedType').value;
        document.getElementById('subjectGroup').style.display = type === 'class' ? 'block' : 'none';
    }

    function toggleAbsenceTimeInputs() {
        let isChecked = document.getElementById('specificTimeCheck').checked;
        document.getElementById('absenceTimeSection').style.display = isChecked ? 'grid' : 'none';
    }

    // ---------- ADD SCHEDULE ----------
    function handleAddSchedule() {
        if (!currentUser) return;

        let name = trim(document.getElementById('profName').value).replace(/\s+/g, ' ');
        let avatar = trim(document.getElementById('profAvatar').value);
        let day = document.getElementById('schedDay').value;
        let type = document.getElementById('schedType').value;
        let subject = trim(document.getElementById('schedSubject').value);
        let startTime = convertTime(document.getElementById('startTime').value);
        let endTime = convertTime(document.getElementById('endTime').value);

        if (!name) {
            showMessage('addMessage', 'Professor name cannot be empty.', 'error');
            return;
        }
        if (startTime === -1 || endTime === -1) {
            showMessage('addMessage', 'Invalid time format. Examples: 7:00 AM, 13:00, or 2:30 PM.', 'error');
            return;
        }
        if (endTime <= startTime) {
            showMessage('addMessage', 'Ending time must be later than starting time.', 'error');
            return;
        }
        if (type === 'class' && !subject) {
            showMessage('addMessage', 'Subject cannot be empty for classes.', 'error');
            return;
        }

        let profIndex = findProfessorIndex(name);
        let existing = profIndex !== -1 ? professors[profIndex] : null;

        if (existing) {
            let conflict = existing.schedules.some(sch =>
                sch.day === day && timeOverlaps(sch.startTime, sch.endTime, startTime, endTime)
            );
            if (conflict) {
                showMessage('addMessage', `Time slot overlaps with an existing schedule entry on ${day}.`, 'error');
                return;
            }
        }

        let newSchedule = {
            day: day,
            startTime: startTime,
            endTime: endTime,
            isClass: type === 'class',
            subject: type === 'class' ? subject : 'Vacant',
            ownerUid: currentUser.uid,
            ownerName: myName()
        };

        let request;
        let id = existing ? existing.id : profKey(name);
        let profUpdateData = {
            name: name,
            avatar: avatar || (existing ? existing.avatar : ''),
            ownerUid: existing ? existing.ownerUid : currentUser.uid,
            ownerName: existing ? existing.ownerName : myName()
        };

        request = database.ref('professors/' + id).update(profUpdateData).then(() => {
            let schedId = database.ref('professors/' + id + '/schedules').push().key;
            return database.ref(`professors/${id}/schedules/${schedId}`).set(newSchedule);
        });

        request.then(() => {
            showMessage('addMessage', 'Schedule saved.', 'success');
            document.getElementById('startTime').value = '';
            document.getElementById('endTime').value = '';
            document.getElementById('schedSubject').value = '';
            document.getElementById('profAvatar').value = '';
        }).catch(err => showMessage('addMessage', friendlyError(err), 'error'));
    }

    // ---------- REMOVE (OWNER ONLY) ----------
    function removeSchedule(profId, schedId) {
        let prof = professors.find(p => p.id === profId);
        if (!prof) return;
        let sch = prof.schedules.find(s => s.id === schedId);
        if (!sch) return;

        if (!isMine(sch.ownerUid)) {
            showMessage('removeMessage', 'You can only remove schedules that you added.', 'error');
            return;
        }

        let label = sch.isClass ? sch.subject : 'Vacant';
        if (!confirm(`Remove this entry for ${prof.name}?\n\n${sch.day} | ${displayTime(sch.startTime)} - ${displayTime(sch.endTime)} | ${label}`)) {
            return;
        }

        let othersRemain = prof.schedules.some(s => s.id !== schedId);

        database.ref(`professors/${profId}/schedules/${schedId}`).remove()
            .then(() => {
                showMessage('removeMessage', 'Schedule removed.', 'success');
                if (!othersRemain && isMine(prof.ownerUid)) {
                    if (confirm(`All schedules for ${prof.name} have been removed.\n\nDelete this professor profile entirely?`)) {
                        return database.ref('professors/' + profId).remove();
                    }
                }
            })
            .catch(err => showMessage('removeMessage', friendlyError(err), 'error'));
    }

    function canDeleteProfessor(prof) {
        return isMine(prof.ownerUid) && prof.schedules.every(s => isMine(s.ownerUid));
    }

    function removeProfessor(profId) {
        let prof = professors.find(p => p.id === profId);
        if (!prof) return;

        if (!canDeleteProfessor(prof)) {
            showMessage('removeMessage', 'Only the creator of a professor profile can delete it, and only when every schedule on it is theirs.', 'error');
            return;
        }
        if (!confirm(`Delete ${prof.name} and all of their schedules?`)) return;

        let nulls = {};
        prof.schedules.forEach(s => { nulls[s.id] = null; });

        let step = prof.schedules.length
            ? database.ref(`professors/${profId}/schedules`).update(nulls)
            : Promise.resolve();

        step.then(() => database.ref('professors/' + profId).remove())
            .then(() => showMessage('removeMessage', 'Professor profile deleted.', 'success'))
            .catch(err => showMessage('removeMessage', friendlyError(err), 'error'));
    }

    // ---------- ABSENCE + CHAT ----------
    function clearChatListeners() {
        chatRefs.forEach(r => r.off());
        chatRefs = [];
    }

    function handleRecordAbsence() {
        let name = trim(document.getElementById('absentProfName').value);
        let day = document.getElementById('absenceDay').value;
        let isSpecific = document.getElementById('specificTimeCheck').checked;
        let reportBox = document.getElementById('absenceReport');

        clearChatListeners();

        let profIndex = findProfessorIndex(name);
        if (profIndex === -1) {
            reportBox.style.display = 'block';
            reportBox.innerHTML = '<p class="alert alert-error">Professor not found. Check the spelling against the All schedules tab.</p>';
            return;
        }

        let absentProf = professors[profIndex];
        let absenceClasses = [];

        if (!isSpecific) {
            absentProf.schedules.forEach(sch => {
                if (sch.day === day && sch.isClass) {
                    absenceClasses.push({ day: sch.day, startTime: sch.startTime, endTime: sch.endTime, subject: sch.subject });
                }
            });
        } else {
            let start = convertTime(document.getElementById('absenceStart').value);
            let end = convertTime(document.getElementById('absenceEnd').value);
            let subj = trim(document.getElementById('absenceSubject').value);

            if (start === -1 || end === -1 || end <= start || !subj) {
                reportBox.style.display = 'block';
                reportBox.innerHTML = '<p class="alert alert-error">Enter a valid start time, end time and subject.</p>';
                return;
            }
            absenceClasses.push({ day: day, startTime: start, endTime: end, subject: subj });
        }

        if (absenceClasses.length === 0) {
            reportBox.style.display = 'block';
            reportBox.innerHTML = `<p class="alert alert-info">No scheduled classes found for ${esc(absentProf.name)} on ${day}.</p>`;
            return;
        }

        let html = `<h3>${esc(absentProf.name)} is absent on ${day}</h3>`;
        let chatsToAttach = [];

        absenceClasses.forEach(absence => {
            html += `<div class="slot"><strong>${esc(absence.subject)}</strong>
                <div class="when">${absence.day}, ${displayTime(absence.startTime)} - ${displayTime(absence.endTime)}</div>`;

            let available = [];
            professors.forEach((p, idx) => {
                if (idx === profIndex) return;
                let hasConflict = p.schedules.some(sch =>
                    sch.day === absence.day && sch.isClass &&
                    timeOverlaps(sch.startTime, sch.endTime, absence.startTime, absence.endTime)
                );
                if (!hasConflict) available.push(p.name);
            });

            if (available.length === 0) {
                html += `<div class="chips"><span class="chip none">No professor is free for this slot</span></div>`;
            } else {
                html += `<div class="chips">${available.map(n => `<span class="chip">${esc(n)}</span>`).join('')}</div>`;

                let chatId = `chat_${absence.day}_${absence.startTime}_${absence.endTime}`.replace(/[:\.]/g, '');
                chatsToAttach.push(chatId);

                html += `
                    <div class="chat">
                        <h4>Coordinate coverage</h4>
                        <div class="chat-msgs" id="${chatId}_messages"><p style="color:var(--muted);margin:0">Loading messages...</p></div>
                        <div class="chat-row">
                            <input type="text" id="${chatId}_input" placeholder="Message as ${esc(myName())}, e.g. Can you take this class?" onkeydown="if(event.key === 'Enter') sendSubstituteMessage('${chatId}')">
                            <button onclick="sendSubstituteMessage('${chatId}')">Send</button>
                        </div>
                    </div>`;
            }
            html += `</div>`;
        });

        reportBox.style.display = 'block';
        reportBox.innerHTML = html;

        chatsToAttach.forEach(chatId => {
            let ref = database.ref('chats/' + chatId);
            chatRefs.push(ref);
            ref.on('value', snapshot => {
                let msgData = snapshot.val();
                let messages = msgData ? Object.values(msgData) : [];
                let msgBox = document.getElementById(`${chatId}_messages`);
                if (!msgBox) return;
                if (messages.length === 0) {
                    msgBox.innerHTML = '<p style="color:var(--muted);margin:0">No messages yet. Send a note to coordinate coverage.</p>';
                } else {
                    msgBox.innerHTML = messages.map(m => `<div><strong>${esc(m.sender)}:</strong> ${esc(m.text)}</div>`).join('');
                    msgBox.scrollTop = msgBox.scrollHeight;
                }
            });
        });
    }

    function sendSubstituteMessage(chatId) {
        let input = document.getElementById(`${chatId}_input`);
        let text = trim(input.value);
        if (!text) return;

        database.ref('chats/' + chatId).push({
            sender: myName(),
            text: text,
            timestamp: firebase.database.ServerValue.TIMESTAMP
        }).then(() => {
            input.value = '';
        }).catch(err => alert(friendlyError(err)));
    }

    // ---------- VIEW ALL ----------
    function renderAllSchedules() {
        let container = document.getElementById('allSchedulesContainer');
        if (professors.length === 0) {
            container.innerHTML = '<p class="empty">No professors added yet.</p>';
            return;
        }

        let dayOrder = { Monday: 1, Tuesday: 2, Wednesday: 3, Thursday: 4, Friday: 5, Saturday: 6, Sunday: 7 };

        let sortedProfs = [...professors].sort((a, b) => a.name.localeCompare(b.name));

        container.innerHTML = sortedProfs.map(prof => {
            let sortedScheds = [...prof.schedules].sort((a, b) => {
                let dDiff = (dayOrder[a.day] || 8) - (dayOrder[b.day] || 8);
                if (dDiff !== 0) return dDiff;
                return a.startTime - b.startTime;
            });

            let avatarContent = prof.avatar 
                ? `<img src="${esc(prof.avatar)}" alt="${esc(prof.name)}" onerror="this.onerror=null;this.parentNode.innerHTML='${initials(prof.name)}';">`
                : initials(prof.name);

            let deletableProf = canDeleteProfessor(prof);

            let schedHtml = sortedScheds.length === 0 
                ? '<p class="empty" style="padding:10px">No schedules listed.</p>'
                : sortedScheds.map(sch => {
                    let mine = isMine(sch.ownerUid);
                    let label = sch.isClass ? esc(sch.subject) : 'Vacant';
                    let whatClass = sch.isClass ? '' : ' vacant';
                    return `
                        <div class="schedule-item">
                            <span class="day">${sch.day.slice(0,3)}</span>
                            <span class="time">${displayTime(sch.startTime)} - ${displayTime(sch.endTime)}</span>
                            <span class="what${whatClass}">${label}</span>
                            ${mine ? `<button class="btn-danger" onclick="removeSchedule('${prof.id}', '${sch.id}')">Remove</button>` : `<span class="locked" title="Added by ${esc(sch.ownerName)}">Added by ${esc(sch.ownerName)}</span>`}
                        </div>`;
                }).join('');

            return `
                <div class="prof">
                    <div class="prof-header">
                        <div class="avatar">${avatarContent}</div>
                        <div class="prof-name">
                            <strong>${esc(prof.name)} ${isMine(prof.ownerUid) ? '<span class="mine-badge">You</span>' : ''}</strong>
                            <span class="owner-note">Profile created by ${esc(prof.ownerName)}</span>
                        </div>
                        ${deletableProf ? `<button class="btn-danger" onclick="removeProfessor('${prof.id}')">Delete profile</button>` : ''}
                    </div>
                    <div style="display:grid;gap:6px">
                        ${schedHtml}
                    </div>
                </div>`;
        }).join('');
    }
</script>
