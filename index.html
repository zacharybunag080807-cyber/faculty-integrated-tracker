<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FSF — Faculty Substitute Finder</title>
<link href="https://fonts.googleapis.com/css2?family=Della+Respira&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
:root{
  --forest: #003d26;
  --primary: #005A36;
  --primary-hover: #004227;
  --accent: #FFC72C;
  --accent-hover: #e0ac20;
  --accent-soft: #fff8d6;
  --paper: #f4f5f1;
  --card: #fbfcf8;
  --field: #eaede5;
  --ink: #14201a;
  --muted: #5d6b62;
  --line: #d5dccf;
  --danger: #a12c2f;
  --danger-soft: #faecec;
  --success: #16794a;
  --success-soft: #dff3e6;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Plus Jakarta Sans',sans-serif;background:var(--paper);color:var(--ink);padding:24px 16px 64px;line-height:1.5}
.container{max-width:860px;margin:0 auto}

/* FEU Green Editorial Masthead */
header{background:var(--forest);color:#fff;border-radius:20px;padding:36px 40px;margin-bottom:24px;box-shadow:0 10px 30px rgba(0,61,38,0.15);position:relative;overflow:hidden}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:16px;
  background:repeating-linear-gradient(90deg,var(--accent) 0 38px,transparent 38px 46px,rgba(255,199,44,.45) 46px 70px,transparent 70px 78px,rgba(255,199,44,.18) 78px 96px,transparent 96px 104px)}
.header-top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap}
header h1{margin:0;font-family:'Della Respira',serif;font-weight:400;font-size:clamp(2rem,4vw,2.6rem);letter-spacing:-0.02em;color:var(--accent)}
header p{margin:8px 0 0;font-family:'Newsreader',serif;font-style:italic;color:#cfe3d7;font-size:1.1rem}

.masthead-status{display:none;align-items:center;gap:12px;background:rgba(0,0,0,0.25);padding:8px 14px;border-radius:8px;font-size:0.82rem;color:#cfe3d7;backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,0.08)}
.masthead-status b{color:#fff;font-weight:600}
.masthead-status button{background:rgba(255,255,255,0.15);color:#fff;padding:2px 8px;font-size:0.75rem;font-weight:600;border:none;border-radius:999px;cursor:pointer}
.masthead-status button:hover{background:rgba(255,255,255,0.3)}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#2fbf71}

.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:32px 40px;box-shadow:0 10px 30px rgba(20,32,26,0.03);margin-bottom:24px}
h2{margin:0 0 24px;font-family:'Della Respira',serif;font-weight:400;font-size:1.5rem;color:var(--forest);letter-spacing:-0.01em}
h3{font-family:'Della Respira',serif;font-weight:400;font-size:1.2rem;color:var(--forest);margin:0 0 8px}

/* Clean Navigation Tabs */
.nav-tabs{display:flex;gap:4px;background:var(--field);padding:4px;border-radius:10px;margin-bottom:24px;border:1px solid var(--line)}
.nav-tabs button{flex:1;background:transparent;color:var(--muted);border-radius:8px;padding:10px 16px;font-size:0.88rem;font-weight:500;border:none;cursor:pointer;transition:all 0.15s ease}
.nav-tabs button:hover{color:var(--ink)}
.nav-tabs button.active{background:var(--forest);color:var(--accent);font-weight:600;box-shadow:0 2px 8px rgba(0,61,38,0.15)}
.tab-content{display:none}.tab-content.active{display:block}

/* Form Fields */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.grid .wide{grid-column:1/-1}
.form-group{margin-bottom:0}
label{display:block;font-weight:500;font-size:0.82rem;color:var(--muted);margin-bottom:6px;letter-spacing:0.01em}
input,select{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:8px;background:var(--field);font:inherit;font-size:0.92rem;color:var(--ink);transition:border-color 0.15s,box-shadow 0.15s}
input[type="file"]{padding:8px;cursor:pointer;background:var(--card)}
input::placeholder{color:#8a978f}
input:focus,select:focus{outline:none;border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px rgba(0,90,54,0.08)}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--primary);margin-right:8px;vertical-align:-2px}
.check{display:flex;align-items:center;background:var(--field);border-radius:8px;padding:12px 14px;cursor:pointer;color:var(--ink);margin:0;border:1px solid var(--line);font-size:0.9rem}

/* Buttons */
button{font:inherit;font-weight:500;font-size:0.9rem;background:var(--primary);color:#fff;border:1px solid var(--primary);border-radius:8px;padding:11px 22px;cursor:pointer;transition:all 0.15s ease}
button:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
button:active{transform:translateY(1px)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#2b2200;margin-top:24px;font-weight:600}
.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn-secondary{background:var(--field);color:var(--forest);border-color:var(--line)}
.btn-secondary:hover{background:#d3dccb;border-color:#d3dccb;color:var(--forest)}
.btn-link{background:none;color:var(--primary);padding:0;border:none;text-decoration:underline;border-radius:0}
.btn-link:hover{background:none;color:var(--primary-hover)}
.btn-danger{background:var(--danger-soft);color:var(--danger);border:1px solid rgba(161,44,47,0.2);padding:6px 12px;font-size:0.78rem;border-radius:6px;flex-shrink:0}
.btn-danger:hover{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn-subtle{background:var(--field);color:var(--forest);border:1px solid var(--line);padding:6px 12px;font-size:0.78rem;border-radius:6px;flex-shrink:0}
.btn-subtle:hover{background:var(--line);color:var(--forest)}

.alert{padding:12px 16px;border-radius:8px;margin-top:16px;font-size:0.88rem;border:1px solid transparent}
.alert-error{background:var(--danger-soft);color:var(--danger);border-color:rgba(161,44,47,0.15)}
.alert-success{background:var(--success-soft);color:var(--success);border-color:rgba(22,121,74,0.15)}
.alert-info{background:#fff3cc;color:#7a5500;border-color:#e6d39c}

/* Auth View */
#authView{max-width:420px;margin:40px auto}
#authView .panel{padding:40px}

/* Slots & Schedules */
.output-box{margin-top:24px;max-height:520px;overflow-y:auto}
.slot{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;padding:20px;margin-bottom:14px}
.slot .when{font-size:0.82rem;color:var(--muted);font-family:'Newsreader',serif;font-style:italic;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{background:var(--success-soft);color:var(--success);border:1px solid rgba(22,121,74,0.2);border-radius:6px;padding:6px 12px;font-size:0.8rem;font-weight:500;display:inline-flex;align-items:center;gap:8px}
.chip button{background:var(--primary);color:#fff;border:none;border-radius:4px;padding:2px 8px;font-size:0.72rem;cursor:pointer}
.chip button:hover{background:var(--primary-hover)}
.chip.none{background:var(--danger-soft);color:var(--danger);border-color:rgba(161,44,47,0.2)}

.mode-badge{display:inline-block;padding:2px 6px;border-radius:4px;font-size:0.7rem;font-weight:600;margin-left:6px;vertical-align:1px}
.mode-online{background:#e0f2fe;color:#0369a1;border:1px solid rgba(3,105,161,0.2)}
.mode-f2f{background:#fef3c7;color:#92400e;border:1px solid rgba(146,64,14,0.2)}

.schedule-list{margin-top:20px;display:grid;gap:16px}
.prof{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px}
.prof-header{display:flex;align-items:center;gap:14px;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--forest);color:var(--accent);border:1px solid var(--line);display:grid;place-items:center;font-family:'Della Respira',serif;font-size:1rem;flex-shrink:0;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.prof-name{flex:1;min-width:0}
.prof-name strong{display:block;font-size:1rem;letter-spacing:-0.01em}
.owner-note{display:block;font-size:0.75rem;color:var(--muted);margin-top:1px}
.mine-badge{background:var(--accent-soft);color:#574500;border:1px solid rgba(255,199,44,0.4);font-size:0.68rem;font-weight:600;padding:1px 6px;border-radius:4px;margin-left:8px;vertical-align:1px}
.schedule-item{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:6px;font-size:0.88rem}
.schedule-item:nth-child(even){background:var(--field)}
.day{width:40px;font-weight:600;color:var(--muted);font-size:0.8rem;text-transform:uppercase;letter-spacing:0.05em;flex-shrink:0}
.time{background:var(--field);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:0.75rem;white-space:nowrap;flex-shrink:0;font-variant-numeric:tabular-nums}
.what{flex:1;min-width:0}
.what.vacant{color:var(--muted);font-style:italic;font-family:'Newsreader',serif}
.locked{font-size:0.75rem;color:var(--muted);flex-shrink:0}
.empty{text-align:center;color:var(--muted);padding:32px 10px;font-style:italic;font-family:'Newsreader',serif}

/* Modal styling for viewing profiles, chat, and large photo */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);display:grid;place-items:center;z-index:1000;padding:16px;backdrop-filter:blur(4px)}
.modal{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:32px;max-width:540px;width:100%;box-shadow:0 20px 40px rgba(0,0,0,0.2);max-height:85vh;overflow-y:auto}
.modal-header{display:flex;align-items:center;gap:16px;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.modal-avatar{width:72px;height:72px;border-radius:50%;background:var(--forest);color:var(--accent);display:grid;place-items:center;font-family:'Della Respira',serif;font-size:1.6rem;overflow:hidden;flex-shrink:0;border:2px solid var(--line);cursor:pointer;position:relative}
.modal-avatar img{width:100%;height:100%;object-fit:cover}
.modal-avatar:hover::after{content:"🔍";position:absolute;inset:0;background:rgba(0,0,0,0.3);display:grid;place-items:center;font-size:1.2rem}

/* Direct Chat Window */
.chat-box{display:flex;flex-direction:column;gap:10px;max-height:300px;overflow-y:auto;background:var(--field);padding:12px;border-radius:8px;border:1px solid var(--line);margin-bottom:16px}
.chat-msg{padding:8px 12px;border-radius:8px;max-width:85%;font-size:0.88rem}
.chat-msg.mine{background:var(--primary);color:#fff;align-self:flex-end}
.chat-msg.theirs{background:#fff;color:var(--ink);border:1px solid var(--line);align-self:flex-start}
.chat-msg .sender-label{font-size:0.7rem;opacity:0.8;margin-bottom:2px;display:block}

/* Fullscreen Photo Lightbox */
.lightbox-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.85);display:grid;place-items:center;z-index:2000;padding:20px;cursor:zoom-out}
.lightbox-content{max-width:90vw;max-height:90vh;border-radius:12px;object-fit:contain;box-shadow:0 10px 30px rgba(0,0,0,0.5)}

@media(max-width:600px){
  body{padding:12px 12px 48px}header{padding:24px 20px}.panel{padding:20px}
  .grid{grid-template-columns:1fr}.nav-tabs{flex-direction:column}
  .schedule-item{flex-wrap:wrap}.what{flex-basis:100%;order:3}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="header-top">
      <div>
        <h1>Faculty Substitute Finder</h1>
        <p>FEU Institute of Technology scheduling registry</p>
      </div>
      <div id="mastheadStatus" class="masthead-status">
        <span><span class="dot"></span> Signed in as <b id="userLabel"></b></span>
        <button onclick="auth.signOut()">Sign out</button>
      </div>
    </div>
  </header>

  <!-- LOGIN / SIGN UP -->
  <div id="authView">
    <div class="panel">
      <h2 id="authTitle" style="text-align:center;margin-bottom:20px">Sign in</h2>
      <div id="signUpFields" style="display:none;">
        <div class="form-group" style="margin-bottom:16px;">
          <label for="authName">Your full name / Professor name</label>
          <input type="text" id="authName" placeholder="e.g., Mr. Demeke Bayyou">
        </div>
        <div class="form-group" style="margin-bottom:16px;">
          <label for="authAvatarFile">Profile picture <span style="font-weight:400;color:var(--muted)">(Optional)</span></label>
          <input type="file" id="authAvatarFile" accept="image/*">
        </div>
      </div>
      <div class="form-group" style="margin-bottom:16px;">
        <label for="authEmail">Email address</label>
        <input type="email" id="authEmail" placeholder="name@fit.edu.ph" autocomplete="username">
      </div>
      <div class="form-group" style="margin-bottom:20px;">
        <label for="authPassword">Password</label>
        <input type="password" id="authPassword" placeholder="At least 6 characters" autocomplete="current-password" onkeydown="if(event.key === 'Enter') handleAuth()">
      </div>
      <button class="btn-primary" id="authBtn" onclick="handleAuth()" style="width:100%;margin-top:0">Sign in</button>
      <div style="text-align:center;margin-top:20px">
        <span id="authSwitchText" style="font-size:0.88rem;color:var(--muted)">No account yet?</span>
        <button class="btn-link" id="authSwitchBtn" onclick="toggleAuthMode()" style="margin-left:6px;font-size:0.88rem">Create one</button>
      </div>
      <div id="authMessage"></div>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="appView" style="display:none;">
    <div class="nav-tabs">
      <button class="active" onclick="switchTab('tab-add', this)">Add schedule</button>
      <button onclick="switchTab('tab-absence', this)">Record absence</button>
      <button onclick="switchTab('tab-view', this)">All schedules</button>
    </div>

    <!-- TAB 1 -->
    <div id="tab-add" class="tab-content panel active">
      <h2>Add a schedule for <span id="currentProfDisplay" style="color:var(--primary);"></span></h2>
      <div class="grid">
        <div class="form-group">
          <label for="schedDay">Day of week</label>
          <select id="schedDay">
            <option>Monday</option><option>Tuesday</option><option>Wednesday</option><option>Thursday</option><option>Friday</option><option>Saturday</option><option>Sunday</option>
          </select>
        </div>
        <div class="form-group">
          <label for="schedType">Entry type</label>
          <select id="schedType" onchange="toggleSubjectInput()">
            <option value="class">Class</option>
            <option value="vacant">Vacant</option>
          </select>
        </div>
        <div class="form-group wide" id="subjectGroup">
          <label for="schedSubject">Subject title</label>
          <input type="text" id="schedSubject" placeholder="e.g., Computer Programming 1L">
        </div>
        <div class="form-group" id="modeGroup">
          <label for="schedMode">Class mode</label>
          <select id="schedMode">
            <option value="Face-to-Face">Face-to-Face</option>
            <option value="Online">Online</option>
          </select>
        </div>
        <div class="form-group">
          <label for="startTime">Start time (e.g., 7:00 AM, 13:00)</label>
          <input type="text" id="startTime" placeholder="7:00 AM">
        </div>
        <div class="form-group">
          <label for="endTime">End time</label>
          <input type="text" id="endTime" placeholder="8:30 AM">
        </div>
      </div>
      <button class="btn-primary" onclick="handleAddSchedule()">Save schedule entry</button>
      <div id="addMessage"></div>
    </div>

    <!-- TAB 2 -->
    <div id="tab-absence" class="tab-content panel">
      <h2>Find a substitute</h2>
      <div class="grid">
        <div class="form-group">
          <label for="absentProfName">Absent professor</label>
          <input type="text" id="absentProfName" placeholder="e.g., Mr. Demeke Bayyou">
        </div>
        <div class="form-group">
          <label for="absenceDay">Day of absence</label>
          <select id="absenceDay">
            <option>Monday</option><option>Tuesday</option><option>Wednesday</option><option>Thursday</option><option>Friday</option><option>Saturday</option><option>Sunday</option>
          </select>
        </div>
        <div class="form-group wide">
          <label class="check"><input type="checkbox" id="specificTimeCheck" onchange="toggleAbsenceTimeInputs()">Absent only during a specific time range</label>
        </div>
      </div>
      <div id="absenceTimeSection" class="grid" style="display:none;margin-top:16px;">
        <div class="form-group">
          <label for="absenceStart">Absence starts</label>
          <input type="text" id="absenceStart" placeholder="9:00 AM">
        </div>
        <div class="form-group">
          <label for="absenceEnd">Absence ends</label>
          <input type="text" id="absenceEnd" placeholder="10:30 AM">
        </div>
        <div class="form-group">
          <label for="absenceSubject">Subject affected</label>
          <input type="text" id="absenceSubject" placeholder="Computer Programming 1L">
        </div>
        <div class="form-group">
          <label for="absenceMode">Class mode</label>
          <select id="absenceMode">
            <option value="Face-to-Face">Face-to-Face</option>
            <option value="Online">Online</option>
          </select>
        </div>
      </div>
      <button class="btn-primary" onclick="handleRecordAbsence()">Find available substitutes</button>
      <div id="absenceReport" class="output-box" style="display:none;"></div>
    </div>

    <!-- TAB 3 -->
    <div id="tab-view" class="tab-content panel">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
        <h2 style="margin:0">All schedules</h2>
        <button onclick="renderAllSchedules()" class="btn-secondary" style="padding:7px 14px;font-size:0.82rem">Refresh list</button>
      </div>
      <div id="removeMessage"></div>
      <div id="allSchedulesContainer" class="schedule-list">
        <p class="empty">No professors added yet.</p>
      </div>
    </div>
  </div>
</div>

<!-- MODAL & LIGHTBOX CONTAINERS -->
<div id="modalContainer"></div>
<div id="lightboxContainer"></div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyD7_5L88hcCuLf_v9CziBl2aaFiVOR-DG0",
        authDomain: "faculty-integrated-tracker.firebaseapp.com",
        databaseURL: "https://faculty-integrated-tracker-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "faculty-integrated-tracker",
        storageBucket: "faculty-integrated-tracker.firebasestorage.app",
        messagingSenderId: "548693695605",
        appId: "1:548693695605:web:b9f6df7278524546346c3c",
        measurementId: "G-XGTD1WR0M5"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const auth = firebase.auth();
    const profRef = database.ref('professors');

    let professors = [];
    let currentUser = null;
    let activeChatRef = null;

    function trim(str) { return str.trim(); }
    function toLower(str) { return str.toLowerCase(); }

    function esc(str) {
        return String(str).replace(/[&<>"']/g, c => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
    }

    function myName() {
        if (!currentUser) return '';
        return currentUser.displayName || (currentUser.email || 'User').split('@')[0];
    }

    function isMine(ownerUid) {
        return !!currentUser && ownerUid === currentUser.uid;
    }

    function initials(name) {
        let parts = trim(name).replace(/^(mr|ms|mrs|dr|prof)\.?\s+/i, '').split(' ').filter(Boolean);
        return ((parts[0] || '?')[0] + (parts.length > 1 ? parts[parts.length - 1][0] : '')).toUpperCase();
    }

    function profKey(name) {
        let clean = toLower(trim(name)).replace(/\s+/g, ' ');
        return Array.from(clean).map(ch =>
            /[a-z0-9]/.test(ch) ? ch : '_' + ch.codePointAt(0).toString(16)
        ).join('');
    }

    function showMessage(elementId, text, type) {
        let el = document.getElementById(elementId);
        el.className = `alert alert-${type}`;
        el.innerText = text;
        setTimeout(() => { el.className = ''; el.innerText = ''; }, 5000);
    }

    function friendlyError(err) {
        if (err && /permission_denied/i.test(err.message || err.code || '')) {
            return 'You can only change entries that you created.';
        }
        return (err && err.message) ? err.message : 'Something went wrong.';
    }

    // ---------- AUTH ----------
    let signUpMode = false;

    function toggleAuthMode() {
        signUpMode = !signUpMode;
        document.getElementById('authTitle').innerText = signUpMode ? 'Create account' : 'Sign in';
        document.getElementById('authBtn').innerText = signUpMode ? 'Create account' : 'Sign in';
        document.getElementById('signUpFields').style.display = signUpMode ? 'block' : 'none';
        document.getElementById('authSwitchText').innerText = signUpMode ? 'Already have an account?' : 'No account yet?';
        document.getElementById('authSwitchBtn').innerText = signUpMode ? 'Sign in' : 'Create one';
        document.getElementById('authPassword').autocomplete = signUpMode ? 'new-password' : 'current-password';
    }

    function handleAuth() {
        let email = trim(document.getElementById('authEmail').value);
        let password = document.getElementById('authPassword').value;
        let name = trim(document.getElementById('authName').value);
        let fileInput = document.getElementById('authAvatarFile');

        if (!email || !password) {
            showMessage('authMessage', 'Enter your email and password.', 'error');
            return;
        }

        if (signUpMode) {
            if (!name) {
                showMessage('authMessage', 'Enter your name.', 'error');
                return;
            }

            const completeSignUp = (avatarUrl) => {
                auth.createUserWithEmailAndPassword(email, password)
                    .then(cred => cred.user.updateProfile({ displayName: name }))
                    .then(() => {
                        currentUser = auth.currentUser;
                        document.getElementById('userLabel').innerText = myName();
                        document.getElementById('currentProfDisplay').innerText = myName();

                        let id = profKey(name);
                        return database.ref('professors/' + id).update({
                            name: name,
                            avatar: avatarUrl || '',
                            ownerUid: currentUser.uid,
                            ownerName: name
                        });
                    })
                    .then(() => {
                        renderAllSchedules();
                    })
                    .catch(err => showMessage('authMessage', err.message, 'error'));
            };

            if (fileInput.files && fileInput.files[0]) {
                let reader = new FileReader();
                reader.onload = function(e) { completeSignUp(e.target.result); };
                reader.onerror = function() { completeSignUp(null); };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                completeSignUp(null);
            }
        } else {
            auth.signInWithEmailAndPassword(email, password)
                .catch(err => showMessage('authMessage', err.message, 'error'));
        }
    }

    function handleProfessorsSnapshot(snapshot) {
        let data = snapshot.val() || {};
        professors = Object.entries(data)
            .filter(([id, p]) => p && p.name)
            .map(([id, p]) => ({
                id: id,
                name: p.name,
                avatar: p.avatar || '',
                ownerUid: p.ownerUid || null,
                ownerName: p.ownerName || 'Unknown',
                schedules: Object.entries(p.schedules || {}).map(([sid, s]) => ({ id: sid, ...s }))
            }));
        renderAllSchedules();
    }

    auth.onAuthStateChanged(user => {
        currentUser = user;
        if (user) {
            document.getElementById('authView').style.display = 'none';
            document.getElementById('appView').style.display = 'block';
            document.getElementById('mastheadStatus').style.display = 'flex';
            document.getElementById('userLabel').innerText = myName();
            document.getElementById('currentProfDisplay').innerText = myName();
            profRef.on('value', handleProfessorsSnapshot, err => {
                console.error(err);
                document.getElementById('allSchedulesContainer').innerHTML =
                    '<p class="alert alert-error">Could not load schedules: ' + esc(err.message) + '</p>';
            });
        } else {
            profRef.off('value');
            if (activeChatRef) { activeChatRef.off(); activeChatRef = null; }
            professors = [];
            document.getElementById('appView').style.display = 'none';
            document.getElementById('mastheadStatus').style.display = 'none';
            document.getElementById('authView').style.display = 'block';
            document.getElementById('authPassword').value = '';
        }
    });

    // ---------- TIME HELPERS ----------
    function convertTime(input) {
        input = trim(input);
        let upper = input.toUpperCase();
        let period = "";

        if (upper.length >= 2) {
            let lastTwo = upper.slice(-2);
            if (lastTwo === "AM" || lastTwo === "PM") {
                period = lastTwo;
                upper = trim(upper.slice(0, -2));
            }
        }

        let colonIdx = upper.indexOf(":");
        if (colonIdx === -1) return -1;

        try {
            let hour = parseInt(upper.slice(0, colonIdx));
            let minute = parseInt(upper.slice(colonIdx + 1));

            if (isNaN(hour) || isNaN(minute) || minute < 0 || minute > 59) return -1;

            if (period === "AM" || period === "PM") {
                if (hour < 1 || hour > 12) return -1;
                if (period === "AM" && hour === 12) hour = 0;
                if (period === "PM" && hour !== 12) hour += 12;
            } else {
                if (hour < 0 || hour > 23) return -1;
            }

            return hour * 60 + minute;
        } catch {
            return -1;
        }
    }

    function displayTime(totalMinutes) {
        let hour = Math.floor(totalMinutes / 60);
        let minute = totalMinutes % 60;
        let period = hour >= 12 ? "PM" : "AM";
        let displayHour = hour % 12;
        if (displayHour === 0) displayHour = 12;
        let formattedMinute = minute < 10 ? "0" + minute : minute;
        return `${displayHour}:${formattedMinute} ${period}`;
    }

    function timeOverlaps(start1, end1, start2, end2) {
        return start1 < end2 && end1 > start2;
    }

    function findProfessorIndex(name) {
        let cleanName = toLower(trim(name)).replace(/\s+/g, ' ');
        return professors.findIndex(p => toLower(p.name).replace(/\s+/g, ' ') === cleanName);
    }

    // ---------- UI ----------
    function switchTab(tabId, btn) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.nav-tabs button').forEach(el => el.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        btn.classList.add('active');
        if (tabId === 'tab-view') renderAllSchedules();
    }

    function toggleSubjectInput() {
        let type = document.getElementById('schedType').value;
        document.getElementById('subjectGroup').style.display = type === 'class' ? 'block' : 'none';
        document.getElementById('modeGroup').style.display = type === 'class' ? 'block' : 'none';
    }

    function toggleAbsenceTimeInputs() {
        let isChecked = document.getElementById('specificTimeCheck').checked;
        document.getElementById('absenceTimeSection').style.display = isChecked ? 'grid' : 'none';
    }

    // ---------- ADD SCHEDULE ----------
    function handleAddSchedule() {
        if (!currentUser) return;

        let name = myName();
        let day = document.getElementById('schedDay').value;
        let type = document.getElementById('schedType').value;
        let subject = trim(document.getElementById('schedSubject').value);
        let mode = document.getElementById('schedMode').value;
        let startTime = convertTime(document.getElementById('startTime').value);
        let endTime = convertTime(document.getElementById('endTime').value);

        if (startTime === -1 || endTime === -1) {
            showMessage('addMessage', 'Invalid time format. Examples: 7:00 AM, 13:00, or 2:30 PM.', 'error');
            return;
        }
        if (endTime <= startTime) {
            showMessage('addMessage', 'Ending time must be later than starting time.', 'error');
            return;
        }
        if (type === 'class' && !subject) {
            showMessage('addMessage', 'Subject cannot be empty for classes.', 'error');
            return;
        }

        let profIndex = findProfessorIndex(name);
        let existing = profIndex !== -1 ? professors[profIndex] : null;

        if (existing) {
            let conflict = existing.schedules.some(sch =>
                sch.day === day && timeOverlaps(sch.startTime, sch.endTime, startTime, endTime)
            );
            if (conflict) {
                showMessage('addMessage', `Time slot overlaps with an existing schedule entry on ${day}.`, 'error');
                return;
            }
        }

        let newSchedule = {
            day: day,
            startTime: startTime,
            endTime: endTime,
            isClass: type === 'class',
            subject: type === 'class' ? subject : 'Vacant',
            mode: type === 'class' ? mode : '',
            ownerUid: currentUser.uid,
            ownerName: myName()
        };

        let id = existing ? existing.id : profKey(name);
        let profUpdateData = {
            name: name,
            avatar: existing ? existing.avatar : '',
            ownerUid: currentUser.uid,
            ownerName: myName()
        };

        database.ref('professors/' + id).update(profUpdateData).then(() => {
            let schedId = database.ref('professors/' + id + '/schedules').push().key;
            return database.ref(`professors/${id}/schedules/${schedId}`).set(newSchedule);
        }).then(() => {
            showMessage('addMessage', 'Schedule saved successfully.', 'success');
            document.getElementById('startTime').value = '';
            document.getElementById('endTime').value = '';
            document.getElementById('schedSubject').value = '';
        }).catch(err => showMessage('addMessage', friendlyError(err), 'error'));
    }

    // ---------- CHANGE PROFILE PICTURE ----------
    function changeProfessorAvatar(profId) {
        let input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.onchange = e => {
            let file = e.target.files[0];
            if (!file) return;
            let reader = new FileReader();
            reader.onload = event => {
                database.ref(`professors/${profId}/avatar`).set(event.target.result)
                    .then(() => showMessage('removeMessage', 'Profile picture updated successfully.', 'success'))
                    .catch(err => showMessage('removeMessage', friendlyError(err), 'error'));
            };
            reader.readAsDataURL(file);
        };
        input.click();
    }

    // ---------- PRIVATE DIRECT MESSAGING ----------
    function openPrivateChat(substituteName) {
        if (!currentUser) return;
        let myProfName = myName();
        if (myProfName === substituteName) {
            alert("You cannot message yourself.");
            return;
        }

        // Create a unique, sorted bidirectional chat ID so only these two professors share the thread
        let sortedNames = [myProfName, substituteName].sort();
        let chatId = 'private_chat_' + profKey(sortedNames[0]) + '_' + profKey(sortedNames[1]);

        if (activeChatRef) { activeChatRef.off(); activeChatRef = null; }

        let modalHTML = `
            <div class="modal-overlay" onclick="closeModal(event)">
                <div class="modal" onclick="event.stopPropagation()">
                    <div class="modal-header">
                        <div>
                            <h3 style="margin:0">Private Chat with ${esc(substituteName)}</h3>
                            <span style="font-size:0.82rem;color:var(--muted)">Secure 1-on-1 substitute coordination</span>
                        </div>
                    </div>
                    <div class="chat-box" id="privateChatBox">
                        <p style="color:var(--muted);text-align:center;font-style:italic">Loading messages...</p>
                    </div>
                    <div style="display:flex;gap:8px">
                        <input type="text" id="privateChatInput" placeholder="Type a private message..." onkeydown="if(event.key === 'Enter') sendPrivateMessage('${chatId}')">
                        <button onclick="sendPrivateMessage('${chatId}')">Send</button>
                    </div>
                    <button class="btn-secondary" style="width:100%;margin-top:16px" onclick="document.getElementById('modalContainer').innerHTML=''">Close Chat</button>
                </div>
            </div>`;
        document.getElementById('modalContainer').innerHTML = modalHTML;

        activeChatRef = database.ref('private_chats/' + chatId);
        activeChatRef.on('value', snapshot => {
            let msgData = snapshot.val();
            let messages = msgData ? Object.values(msgData) : [];
            let box = document.getElementById('privateChatBox');
            if (!box) return;

            if (messages.length === 0) {
                box.innerHTML = '<p style="color:var(--muted);text-align:center;font-style:italic">No messages yet. Start the conversation!</p>';
            } else {
                box.innerHTML = messages.map(m => {
                    let mine = m.senderUid === currentUser.uid;
                    return `<div class="chat-msg ${mine ? 'mine' : 'theirs'}">
                        <span class="sender-label">${esc(m.senderName)}</span>
                        ${esc(m.text)}
                    </div>`;
                }).join('');
                box.scrollTop = box.scrollHeight;
            }
        });
    }

    function sendPrivateMessage(chatId) {
        let input = document.getElementById('privateChatInput');
        let text = trim(input.value);
        if (!text) return;

        database.ref('private_chats/' + chatId).push({
            senderUid: currentUser.uid,
            senderName: myName(),
            text: text,
            timestamp: firebase.database.ServerValue.TIMESTAMP
        }).then(() => {
            input.value = '';
        }).catch(err => alert(friendlyError(err)));
    }

    // ---------- VIEW PROFILE MODAL & PHOTO LIGHTBOX ----------
    function viewProfileModal(profId) {
        let prof = professors.find(p => p.id === profId);
        if (!prof) return;

        let dayOrder = { Monday: 1, Tuesday: 2, Wednesday: 3, Thursday: 4, Friday: 5, Saturday: 6, Sunday: 7 };
        let sortedScheds = [...prof.schedules].sort((a, b) => {
            let dDiff = (dayOrder[a.day] || 8) - (dayOrder[b.day] || 8);
            if (dDiff !== 0) return dDiff;
            return a.startTime - b.startTime;
        });

        let avatarContent = prof.avatar 
            ? `<img src="${prof.avatar}" alt="${esc(prof.name)}" onclick="openLightbox('${esc(prof.avatar)}')">`
            : initials(prof.name);

        let schedHtml = sortedScheds.length === 0 
            ? '<p class="empty" style="padding:10px">No schedules listed yet.</p>'
            : sortedScheds.map(sch => {
                let label = sch.isClass ? esc(sch.subject) : 'Vacant';
                let whatClass = sch.isClass ? '' : ' vacant';
                let modeBadge = (sch.isClass && sch.mode) ? `<span class="mode-badge ${sch.mode === 'Online' ? 'mode-online' : 'mode-f2f'}">${sch.mode}</span>` : '';
                return `
                    <div class="schedule-item">
                        <span class="day">${sch.day.slice(0,3)}</span>
                        <span class="time">${displayTime(sch.startTime)} – ${displayTime(sch.endTime)}</span>
                        <span class="what${whatClass}">${label} ${modeBadge}</span>
                    </div>`;
            }).join('');

        let modalHTML = `
            <div class="modal-overlay" onclick="closeModal(event)">
                <div class="modal">
                    <div class="modal-header">
                        <div class="modal-avatar" ${prof.avatar ? `title="Click photo to enlarge"` : ''}>${avatarContent}</div>
                        <div>
                            <h3 style="margin:0">${esc(prof.name)}</h3>
                            <span style="font-size:0.82rem;color:var(--muted)">Professor Schedule Profile</span>
                        </div>
                    </div>
                    <div style="display:grid;gap:4px;margin-bottom:20px">
                        ${schedHtml}
                    </div>
                    <button class="btn-secondary" style="width:100%" onclick="document.getElementById('modalContainer').innerHTML=''">Close Profile</button>
                </div>
            </div>`;
        document.getElementById('modalContainer').innerHTML = modalHTML;
    }

    function openLightbox(imgSrc) {
        let lightboxHTML = `
            <div class="lightbox-overlay" onclick="document.getElementById('lightboxContainer').innerHTML=''">
                <img src="${imgSrc}" class="lightbox-content" alt="Enlarged profile picture">
            </div>`;
        document.getElementById('lightboxContainer').innerHTML = lightboxHTML;
    }

    function closeModal(e) {
        if (e.target.classList.contains('modal-overlay')) {
            document.getElementById('modalContainer').innerHTML = '';
            if (activeChatRef) { activeChatRef.off(); activeChatRef = null; }
        }
    }

    // ---------- REMOVE ----------
    function removeSchedule(profId, schedId) {
        let prof = professors.find(p => p.id === profId);
        if (!prof) return;
        let sch = prof.schedules.find(s => s.id === schedId);
        if (!sch) return;

        if (!isMine(sch.ownerUid)) {
            showMessage('removeMessage', 'You can only remove schedules that you added.', 'error');
            return;
        }

        let label = sch.isClass ? sch.subject : 'Vacant';
        if (!confirm(`Remove this entry?\n\n${sch.day} | ${displayTime(sch.startTime)} - ${displayTime(sch.endTime)} | ${label}`)) {
            return;
        }

        let othersRemain = prof.schedules.some(s => s.id !== schedId);

        database.ref(`professors/${profId}/schedules/${schedId}`).remove()
            .then(() => {
                showMessage('removeMessage', 'Schedule removed.', 'success');
                if (!othersRemain && isMine(prof.ownerUid)) {
                    if (confirm(`All schedules have been removed.\n\nDelete your professor profile entirely?`)) {
                        return database.ref('professors/' + profId).remove();
                    }
                }
            })
            .catch(err => showMessage('removeMessage', friendlyError(err), 'error'));
    }

    function canDeleteProfessor(prof) {
        return isMine(prof.ownerUid) && prof.schedules.every(s => isMine(s.ownerUid));
    }

    function removeProfessor(profId) {
        let prof = professors.find(p => p.id === profId);
        if (!prof) return;

        if (!canDeleteProfessor(prof)) {
            showMessage('removeMessage', 'You can only delete your own profile.', 'error');
            return;
        }
        if (!confirm(`Delete your professor profile and all of your schedules?`)) return;

        let nulls = {};
        prof.schedules.forEach(s => { nulls[s.id] = null; });

        let step = prof.schedules.length
            ? database.ref(`professors/${profId}/schedules`).update(nulls)
            : Promise.resolve();

        step.then(() => database.ref('professors/' + profId).remove())
            .then(() => showMessage('removeMessage', 'Professor profile deleted.', 'success'))
            .catch(err => showMessage('removeMessage', friendlyError(err), 'error'));
    }

    // ---------- ABSENCE ----------
    function handleRecordAbsence() {
        let name = trim(document.getElementById('absentProfName').value);
        let day = document.getElementById('absenceDay').value;
        let isSpecific = document.getElementById('specificTimeCheck').checked;
        let reportBox = document.getElementById('absenceReport');

        if (activeChatRef) { activeChatRef.off(); activeChatRef = null; }

        let profIndex = findProfessorIndex(name);
        if (profIndex === -1) {
            reportBox.style.display = 'block';
            reportBox.innerHTML = '<p class="alert alert-error">Professor not found. Check the spelling against the All schedules tab.</p>';
            return;
        }

        let absentProf = professors[profIndex];
        let absenceClasses = [];

        if (!isSpecific) {
            absentProf.schedules.forEach(sch => {
                if (sch.day === day && sch.isClass) {
                    absenceClasses.push({ day: sch.day, startTime: sch.startTime, endTime: sch.endTime, subject: sch.subject, mode: sch.mode });
                }
            });
        } else {
            let start = convertTime(document.getElementById('absenceStart').value);
            let end = convertTime(document.getElementById('absenceEnd').value);
            let subj = trim(document.getElementById('absenceSubject').value);
            let mode = document.getElementById('absenceMode').value;

            if (start === -1 || end === -1 || end <= start || !subj) {
                reportBox.style.display = 'block';
                reportBox.innerHTML = '<p class="alert alert-error">Enter a valid start time, end time and subject.</p>';
                return;
            }
            absenceClasses.push({ day: day, startTime: start, endTime: end, subject: subj, mode: mode });
        }

        if (absenceClasses.length === 0) {
            reportBox.style.display = 'block';
            reportBox.innerHTML = `<p class="alert alert-info">No scheduled classes found for ${esc(absentProf.name)} on ${day}.</p>`;
            return;
        }

        let html = `<h3 style="margin-bottom:16px">${esc(absentProf.name)} — Absent on ${day}</h3>`;

        absenceClasses.forEach(absence => {
            let modeBadge = absence.mode ? `<span class="mode-badge ${absence.mode === 'Online' ? 'mode-online' : 'mode-f2f'}">${absence.mode}</span>` : '';
            html += `<div class="slot"><strong style="font-family:'Della Respira',serif;font-size:1.05rem">${esc(absence.subject)} ${modeBadge}</strong>
                <div class="when">${absence.day}, ${displayTime(absence.startTime)} – ${displayTime(absence.endTime)}</div>`;

            let available = [];
            professors.forEach((p, idx) => {
                if (idx === profIndex) return;
                let hasConflict = p.schedules.some(sch =>
                    sch.day === absence.day && sch.isClass &&
                    timeOverlaps(sch.startTime, sch.endTime, absence.startTime, absence.endTime)
                );
                if (!hasConflict) available.push(p.name);
            });

            if (available.length === 0) {
                html += `<div class="chips"><span class="chip none">No professor is free for this slot</span></div>`;
            } else {
                html += `<div class="chips">${available.map(n => `<span class="chip">${esc(n)} <button onclick="openPrivateChat('${esc(n)}')">Message</button></span>`).join('')}</div>`;
            }
            html += `</div>`;
        });

        reportBox.style.display = 'block';
        reportBox.innerHTML = html;
    }

    // ---------- VIEW ALL ----------
    function renderAllSchedules() {
        let container = document.getElementById('allSchedulesContainer');
        if (professors.length === 0) {
            container.innerHTML = '<p class="empty">No professors added yet.</p>';
            return;
        }

        let dayOrder = { Monday: 1, Tuesday: 2, Wednesday: 3, Thursday: 4, Friday: 5, Saturday: 6, Sunday: 7 };
        let sortedProfs = [...professors].sort((a, b) => a.name.localeCompare(b.name));

        container.innerHTML = sortedProfs.map(prof => {
            let sortedScheds = [...prof.schedules].sort((a, b) => {
                let dDiff = (dayOrder[a.day] || 8) - (dayOrder[b.day] || 8);
                if (dDiff !== 0) return dDiff;
                return a.startTime - b.startTime;
            });

            let avatarContent = prof.avatar 
                ? `<img src="${prof.avatar}" alt="${esc(prof.name)}" onerror="this.onerror=null;this.parentNode.innerHTML='${initials(prof.name)}';">`
                : initials(prof.name);

            let deletableProf = canDeleteProfessor(prof);

            let schedHtml = sortedScheds.length === 0 
                ? '<p class="empty" style="padding:10px">No schedules listed.</p>'
                : sortedScheds.map(sch => {
                    let mine = isMine(sch.ownerUid);
                    let label = sch.isClass ? esc(sch.subject) : 'Vacant';
                    let whatClass = sch.isClass ? '' : ' vacant';
                    let modeBadge = (sch.isClass && sch.mode) ? `<span class="mode-badge ${sch.mode === 'Online' ? 'mode-online' : 'mode-f2f'}">${sch.mode}</span>` : '';
                    return `
                        <div class="schedule-item">
                            <span class="day">${sch.day.slice(0,3)}</span>
                            <span class="time">${displayTime(sch.startTime)} – ${displayTime(sch.endTime)}</span>
                            <span class="what${whatClass}">${label} ${modeBadge}</span>
                            ${mine ? `<button class="btn-danger" onclick="removeSchedule('${prof.id}', '${sch.id}')">Remove</button>` : `<span class="locked" title="Added by ${esc(sch.ownerName)}">Added by ${esc(sch.ownerName)}</span>`}
                        </div>`;
                }).join('');

            return `
                <div class="prof">
                    <div class="prof-header">
                        <div class="avatar">${avatarContent}</div>
                        <div class="prof-name">
                            <strong>${esc(prof.name)} ${isMine(prof.ownerUid) ? '<span class="mine-badge">You</span>' : ''}</strong>
                            <span class="owner-note">Professor</span>
                        </div>
                        <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
                            <button class="btn-subtle" onclick="viewProfileModal('${prof.id}')">View Profile</button>
                            ${isMine(prof.ownerUid) ? `<button class="btn-subtle" onclick="changeProfessorAvatar('${prof.id}')">Change Photo</button>` : ''}
                            ${deletableProf ? `<button class="btn-danger" onclick="removeProfessor('${prof.id}')">Delete profile</button>` : ''}
                        </div>
                    </div>
                    <div style="display:grid;gap:4px">
                        ${schedHtml}
                    </div>
                </div>`;
        }).join('');
    }
</script>
